# Add-on: the geo global name. Same on every site:  kubectl apply -k k8s/addons/geo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gslb-geo.yaml

configMapGenerator:
  - name: geo-env
    envs: [env.properties]
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source: {kind: ConfigMap, name: geo-env, fieldPath: data.GEO_HOST}
    targets: [{select: {kind: Ingress, name: todo-web-geo}, fieldPaths: [spec.rules.0.host]}]
