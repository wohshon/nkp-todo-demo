# HPOC nkp2 = dev-cluster2: app + global names (aa, ap) + its own CNPG database instance.
# The app uses nkp1's database (app-db/db.sh use-remote) until you switch it with app-db/db.sh use-local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - patch: |-
      $patch: delete
      apiVersion: k8gb.io/v1beta1
      kind: Gslb
      metadata: {name: todo-web-geo, namespace: todo-demo}
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: todo-web-geo, namespace: todo-demo}

configMapGenerator:
  - name: gslb-env
    envs: [env.properties]
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"   # carries values only; not deployed

replacements:
  - source: {kind: ConfigMap, name: gslb-env, fieldPath: data.AA_HOST}
    targets: [{select: {kind: Ingress, name: todo-web-aa}, fieldPaths: [spec.rules.0.host]}]
  - source: {kind: ConfigMap, name: gslb-env, fieldPath: data.AP_HOST}
    targets: [{select: {kind: Ingress, name: todo-web-ap}, fieldPaths: [spec.rules.0.host]}]
  - source: {kind: ConfigMap, name: gslb-env, fieldPath: data.PRIMARY_GEOTAG}
    targets: [{select: {kind: Gslb, name: todo-web-ap}, fieldPaths: [spec.strategy.primaryGeoTag]}]
