# nkp1's CNPG primary on a MetalLB IP, so the app on nkp2 can use it.
# The IP is filled in from env.properties (DB_LB_IP).
apiVersion: v1
kind: Service
metadata:
  name: todo-postgres-ext
  namespace: todo-demo
  annotations:
    metallb.universe.tf/loadBalancerIPs: "0.0.0.0"
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: todo-postgres
    cnpg.io/instanceRole: primary     # older CNPG versions label the primary "role: primary"
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
