# Global names for the todo app: one Ingress + one Gslb per hostname.
# k8gb takes the hostname from the Ingress, so each strategy needs its own Ingress.
# The hostnames and the failover primary below are placeholders; each environment's
# overlay (overlays/<env>/env.properties) sets the real values.
# No IP addresses here: those belong to the k8gb install on each cluster, not to the app.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-web-aa
  namespace: todo-demo
spec:
  ingressClassName: kommander-traefik
  rules:
    - host: aa.gslb.example.local
      http:
        paths:
          - {path: /app, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: todo-web-aa
  namespace: todo-demo
spec:
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: todo-web-aa
  strategy:
    type: roundRobin          # active-active: every healthy site
    dnsTtlSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-web-ap
  namespace: todo-demo
spec:
  ingressClassName: kommander-traefik
  rules:
    - host: ap.gslb.example.local
      http:
        paths:
          - {path: /app, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: todo-web-ap
  namespace: todo-demo
spec:
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: todo-web-ap
  strategy:
    type: failover            # active-passive: the primary while it is healthy
    primaryGeoTag: site1
    dnsTtlSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-web-geo
  namespace: todo-demo
spec:
  ingressClassName: kommander-traefik
  rules:
    - host: geo.gslb.example.local
      http:
        paths:
          - {path: /app, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: todo-web, port: {number: 80}}}}
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: todo-web-geo
  namespace: todo-demo
spec:
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: todo-web-geo
  strategy:
    type: geoip               # the site matching the query's source network
    dnsTtlSeconds: 10
